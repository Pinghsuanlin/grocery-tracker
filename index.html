<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">

<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">

<title>Groceries</title>

<style>
:root{
  --bg:#eef2ec; --surface:#ffffff; --sunk:#e3e9e1; --ink:#18211c; --muted:#56635a; --line:#d2dbd0;
  --accent:#1f6b47; --accent-ink:#ffffff; --tag:#ffd94a; --tag-ink:#1d1a08;
  --great:#1c7d45; --good:#4f8f27; --typical:#6b7570; --expensive:#b8420e; --new:#35659b; --danger:#b42318;
  --price:"Archivo","Arial Narrow",system-ui,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121714; --surface:#1b221e; --sunk:#242d28; --ink:#e7ede8; --muted:#a3b0a7; --line:#303b35;
    --accent:#5cc28e; --accent-ink:#0c1711; --tag:#f2c94c; --tag-ink:#1d1a08;
    --great:#4cc47e; --good:#8fc75b; --typical:#a3ada8; --expensive:#f08a4b; --new:#7fa9dc; --danger:#f07167; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:10px}
header.top h1{font-family:var(--price);font-stretch:80%;font-weight:800;font-size:28px;line-height:1;margin:0;flex:1}
.iconbtn{border:0;background:var(--surface);border-radius:12px;min-width:44px;height:44px;padding:0 12px;font-size:15px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.sub{color:var(--muted);font-size:14px}
.small{font-size:12px}
.zh{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
h2.sec{font-size:17px;margin:0 0 8px}
.btn{border:0;border-radius:12px;min-height:48px;padding:0 16px;font-weight:650;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.danger{color:var(--danger)}
.btn.small{min-height:38px;font-size:14px;padding:0 12px}
.btn.block{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row2>*,.row3>*{min-width:0}
label.f{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input.t,select.t,textarea.t{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 10px;font-size:16px}
textarea.t{min-height:140px}
input[type="file"]{display:block;width:100%;max-width:100%;font-size:14px;margin-top:4px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.links .btn{flex:1 1 140px}
.status{font-size:13px;color:var(--muted);margin:2px 0 0}
.status.bad{color:var(--expensive)}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
.err{color:var(--danger);font-size:14px;margin-top:8px}

/* the shelf price tag: the one bold element */
.pricetag{position:relative;background:var(--tag);color:var(--tag-ink);border-radius:12px 12px 12px 12px;padding:16px 18px 14px 34px;margin:12px 0;overflow:hidden}
.pricetag::before{content:"";position:absolute;left:12px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.pricetag .what{font-weight:650;font-size:15px;opacity:.85;padding-right:118px;min-height:30px}
.pricetag .big{font-family:var(--price);font-stretch:72%;font-weight:850;font-size:52px;line-height:1;letter-spacing:-.5px;margin-top:2px}
.pricetag .unit{font-family:var(--price);font-stretch:85%;font-weight:700;font-size:20px;margin-top:2px}
.pricetag .note{font-size:14px;margin-top:6px;opacity:.9}
.sticker{position:absolute;right:12px;top:12px;transform:rotate(4deg);border-radius:8px;padding:6px 10px;font-weight:800;font-size:14px;color:#fff;font-family:var(--price);font-stretch:90%;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.k-great{background:var(--great)} .k-good{background:var(--good)} .k-typical{background:var(--typical)} .k-expensive{background:var(--expensive)} .k-new{background:var(--new)} .k-none{display:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:6px}

.cta{display:block;width:100%;text-align:left;border:0;cursor:pointer}
.cta .big{font-size:34px}
.list{display:grid}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .r{text-align:right;font-family:var(--price);font-stretch:85%;font-weight:700;font-size:17px;white-space:nowrap}
.li .r small{display:block;font-family:var(--text);font-weight:400;font-size:12px;color:var(--muted)}
.tagpill{display:inline-block;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);border-radius:6px;padding:1px 6px;vertical-align:middle}
table.t2{width:100%;border-collapse:collapse;font-size:15px}
table.t2 td,table.t2 th{padding:8px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.t2 th{font-size:13px;color:var(--muted);font-weight:600;border-top:0}
table.t2 td.n{text-align:right;font-family:var(--price);font-stretch:85%;font-weight:700;white-space:nowrap}
.chart{width:100%;height:auto;display:block;margin:6px 0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.rline{border-top:1px solid var(--line);padding:12px 0}
.rline:first-child{border-top:0}
.rline.off{opacity:.45}
.rline .raw{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;word-break:break-word}
.pickbtn{width:100%;text-align:left;border:1px dashed var(--line);border-radius:10px;background:var(--bg);min-height:44px;padding:8px 10px;font-weight:600}
.pickbtn.set{border-style:solid}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.badge.rem{background:color-mix(in srgb,var(--great) 20%,var(--surface));color:var(--great)}
.badge.guess{background:color-mix(in srgb,var(--new) 18%,var(--surface));color:var(--new)}
.sumcheck{padding:8px 10px;border-radius:10px;font-size:14px;margin:8px 0}
.sumcheck.ok{background:color-mix(in srgb,var(--great) 14%,var(--surface))}
.sumcheck.warn{background:color-mix(in srgb,var(--expensive) 16%,var(--surface))}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;gap:10px;padding:0}
.bar .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:30;max-width:90vw;text-align:center}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheetcard{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.sheetcard .hd{display:flex;gap:10px;align-items:center;position:sticky;top:-14px;background:var(--surface);padding:6px 0}
.sheetcard .hd input{flex:1}
.banner{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--expensive);border-radius:14px;padding:12px 14px;margin:10px 0}
.banner p{margin:4px 0 8px;font-size:14px;color:var(--muted)}
.photo{max-width:100%;border-radius:10px;display:block;margin-top:8px}
.warnline{margin-top:8px;padding:6px 8px;border-radius:8px;background:rgba(184,66,14,.16);font-weight:700;font-size:14px}
.warntext{color:var(--expensive)}
.filters .chips{margin:10px 0 8px} .filters .row2{margin-top:6px}
[data-act="pfperiod"][aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:inherit;text-decoration:underline;text-underline-offset:2px;min-height:28px;text-align:left}
.checkrow{display:flex;gap:8px;align-items:center;min-height:46px;font-size:15px}
.checkrow input{width:22px;height:22px}
details.more{margin-top:12px} details.more summary{font-weight:600;min-height:36px;display:flex;align-items:center;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.userswitch{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.userswitch button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-weight:600;font-size:14px;color:var(--muted)}
.userswitch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media (prefers-reduced-motion: no-preference){ .toast{animation:pop .18s ease-out} @keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}} .pricetag .sticker{animation:stick .22s ease-out} @keyframes stick{from{transform:rotate(14deg) scale(1.3);opacity:0}to{transform:rotate(4deg) scale(1);opacity:1}} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="barhost"></div>
<script>
/*CORE-START*/
const LOG_HEADER = "id,date,store,item,product,brand,own_label,pack_count,pack_size,pack_unit,packs,weight,price_paid,currency,rate,price_eur,qty_basis,unit_price_eur,promo,person,source,photo,notes,value";

/* ---------- numbers & formatting ---------- */
// Accepts "2,99", "2.99", "1.234,56", "1,234.56", "€ 3", "3 €"
function parseNum(v){
  if(v==null) return NaN; let s=String(v).trim().replace(/[€\s]|EUR/gi,""); if(!s) return NaN;
  const lc=s.lastIndexOf(","), ld=s.lastIndexOf(".");
  if(lc>-1 && ld>-1){ s = lc>ld ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(lc>-1){ s=s.replace(",","."); }
  const n=parseFloat(s); return isFinite(n)?n:NaN;
}
function round(n,d){ const f=Math.pow(10,d); return Math.round(n*f)/f; }
function fmtMoney(n, cur){ if(typeof n!=="number" || !Number.isFinite(n)) return "–"; try{ return n.toLocaleString("es-ES",{style:"currency",currency:cur||"EUR",minimumFractionDigits:(cur==="JPY"||cur==="TWD")?0:2,maximumFractionDigits:(cur==="JPY"||cur==="TWD")?0:2}); }catch(e){ return n.toFixed(2)+" "+(cur||"EUR"); } }
function fmtUnitPrice(n, basis, unitName){ if(typeof n!=="number" || !Number.isFinite(n)) return "–";   /* missing unit price (size unknown) */ const per = basis==="unit" ? (unitName||"unit") : basis; const dec = n<0.5?3:2; /* small unit prices (per egg, per roll) need the third decimal */ return n.toLocaleString("es-ES",{minimumFractionDigits:dec,maximumFractionDigits:dec})+" €/"+per; }

/* ---------- quantities ---------- */
const UNIT_TO = { g:["kg",0.001], kg:["kg",1], mg:["kg",1e-6], ml:["L",0.001], cl:["L",0.01], l:["L",1], L:["L",1], unit:["unit",1], u:["unit",1] };
function toBasis(amount, unit, basis){
  const u = UNIT_TO[unit] || UNIT_TO[String(unit).toLowerCase()];
  if(!u || !(amount>0)) return NaN;
  if(basis==="unit") return u[0]==="unit" ? amount*u[1] : NaN;
  if(u[0]!==basis) return NaN;            // e.g. grams for an item priced per litre
  return amount*u[1];
}
/* Total quantity bought in the item's basis.
   by pack: packs × pack_count × pack_size (pack_unit); by weight: weight (kg or L, or g/ml) */
function quantityInBasis(p, basis){
  if(p.weight>0) return toBasis(p.weight, p.weightUnit||(basis==="L"?"L":"kg"), basis);
  const countUnit = !p.pack_unit || p.pack_unit==="unit" || p.pack_unit==="u";
  const per = toBasis(p.pack_size>0 ? p.pack_size : (countUnit ? 1 : NaN), p.pack_unit||"unit", basis);   /* a missing weight or volume is never guessed */
  return (p.packs>0?p.packs:1) * (p.pack_count>0?p.pack_count:1) * per;
}
/* ---------- promotions ---------- */
const PROMOS = [
  ["", "No offer"], ["2x1","2×1 (buy 2, pay 1)"], ["3x2","3×2 (buy 3, pay 2)"],
  ["2nd50","2ª unidad al 50%"], ["2nd70","2ª unidad al 70%"], ["pct","% off"]];
/* Price multiplier for the whole quantity when the offer applies (buying the right number of packs). */
function promoFactor(code, pct){
  switch(code){ case "2x1": return 0.5; case "3x2": return 2/3; case "2nd50": return 0.75; case "2nd70": return 0.65;
    case "pct": return (pct>0 && pct<100) ? 1-pct/100 : 1; default: return 1; }
}
/* ---------- verdicts ---------- */
function quantile(sorted, q){ if(!sorted.length) return NaN; const pos=(sorted.length-1)*q, lo=Math.floor(pos), hi=Math.ceil(pos); return sorted[lo]+(sorted[hi]-sorted[lo])*(pos-lo); }
function priceStats(values){
  const v=values.filter(x=>isFinite(x)&&x>0).slice().sort((a,b)=>a-b);
  return {n:v.length, best:v[0], p25:quantile(v,0.25), median:quantile(v,0.5), p75:quantile(v,0.75), worst:v[v.length-1]};
}
/* How good is this unit price compared with what you've paid before? */
function verdict(up, history){
  const s=priceStats(history);
  if(!isFinite(up) || up<=0) return {kind:"none", label:"Enter a price", text:""};
  if(!s.n) return {kind:"new", label:"First price", text:"Nothing to compare yet. Log it to start a history.", stats:s};
  const vsTypical = (up/s.median-1)*100;
  const rel = Math.abs(vsTypical)<1 ? "about your usual price" : `${Math.round(Math.abs(vsTypical))}% ${vsTypical<0?"below":"above"} your usual price`;
  if(up < s.best*0.995) return {kind:"great", label:"Best price yet", text:`Cheaper than anything you've logged; ${rel}.`, stats:s, vsTypical};
  if(up <= s.best*1.05) return {kind:"great", label:"Great deal", text:`Within 5% of your best price; ${rel}.`, stats:s, vsTypical};
  if(s.n>=4){
    if(up <= s.p25) return {kind:"good", label:"Good price", text:`Cheaper than three quarters of your purchases; ${rel}.`, stats:s, vsTypical};
    if(up <= s.p75) return {kind:"typical", label:"Typical", text:`In your usual range; ${rel}.`, stats:s, vsTypical};
    return {kind:"expensive", label:"Expensive", text:`Pricier than three quarters of your purchases; ${rel}.`, stats:s, vsTypical};
  }
  if(up <= s.median) return {kind:"good", label:"Good price", text:`${rel[0].toUpperCase()+rel.slice(1)}. A few more purchases will sharpen this.`, stats:s, vsTypical};
  if(up <= s.median*1.15) return {kind:"typical", label:"Typical", text:`${rel[0].toUpperCase()+rel.slice(1)}.`, stats:s, vsTypical};
  return {kind:"expensive", label:"Expensive", text:`${rel[0].toUpperCase()+rel.slice(1)}.`, stats:s, vsTypical};
}
/* ---------- text helpers ---------- */
function fold(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase(); }
function tokens(s){ return fold(s).replace(/[^A-Z0-9\u3400-\u9fff ]+/g," ").split(/\s+/).filter(t=>t.length>=2 && !/^\d+$/.test(t)); }
function normLine(s){ return fold(s).replace(/[^A-Z0-9 ]+/g," ").replace(/\s+/g," ").trim(); }

/* ---------- stores & dates ---------- */
function detectStore(text, stores){
  const t=fold(text);
  let best=null;
  for(const st of stores||[]) for(const k of st.keywords||[]){ const i=t.indexOf(fold(k)); if(i>-1 && (!best || i<best.pos)) best={store:st, pos:i}; }
  return best? best.store : null;
}
function parseReceiptDate(text, today){
  const t=String(text); const now=today?new Date(today+"T12:00:00"):new Date();
  const cands=[];
  for(const m of t.matchAll(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/g)){ let [_,d,mo,y]=m; y=+y; if(y<100) y+=2000; cands.push([y,+mo,+d]); }
  for(const m of t.matchAll(/\b(20\d{2})-(\d{1,2})-(\d{1,2})\b/g)){ cands.push([+m[1],+m[2],+m[3]]); }
  for(const [y,mo,d] of cands){
    if(mo<1||mo>12||d<1||d>31||y<2015) continue;
    const dt=new Date(y,mo-1,d,12); if(dt>now) continue;
    return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  }
  return null;
}
/* ---------- pack size inside a product name ---------- */
function parseSize(name){
  const t=fold(name).replace(/,/g,".");
  let m;
  if((m=t.match(/(\d+)\s*[X×]\s*(\d+(?:\.\d+)?)\s*(KG|G|GR|ML|CL|L|LT|LTR)\b/))) return {pack_count:+m[1], pack_size:+m[2], pack_unit:unitCode(m[3])};
  if((m=t.match(/(\d+(?:\.\d+)?)\s*(KG|G|GR|ML|CL|L|LT|LTR)\b/))) return {pack_count:1, pack_size:+m[1], pack_unit:unitCode(m[2])};
  if((m=t.match(/(\d+)\s*(UDS|UD|UNIDADES|U|ROLLOS|LAVADOS|CAPSULAS|PASTILLAS)\b/))) return {pack_count:+m[1], pack_size:1, pack_unit:"unit"};
  if((m=t.match(/\b(?:PACK|PK|X)\s*(\d+)\b/))) return {pack_count:+m[1], pack_size:null, pack_unit:null};
  return null;
}
function unitCode(u){ u=u.toUpperCase(); if(u==="KG") return "kg"; if(u==="G"||u==="GR") return "g"; if(u==="ML") return "ml"; if(u==="CL") return "cl"; return "L"; }

/* ---------- receipt reading (text from the iPhone's Live Text, or typed) ---------- */
const SKIP_RE=/^(TOTAL|SUBTOTAL|SUB TOTAL|IVA|I\.V\.A|BASE|CUOTA|TARJETA|VISA|MASTERCARD|MAESTRO|EFECTIVO|ENTREGADO|ENTREGA|CAMBIO|IMPORTE|N[º°O]?\s*TARJ|NIF|N\.I\.F|CIF|C\.I\.F|TEL|TELF|FACTURA|FRA\.|OP[:\s]|TICKET|GRACIAS|ATENDIDO|LE ATENDIO|CAJA|TPV|AUT|ARC|PUNTOS|AHORRO|SE ADMITEN|DEVOLUCION|CONSERVE|FECHA|HORA|DIRECCION|C\/|AVDA|CALLE|WWW|HTTP|DESCRIPCION|ARTICULO|CANT|P\.?\s?UNIT|IMP\.|TOTAL A PAGAR|PAGO|CONTACTLESS|COPIA|CLIENTE|SALDO|BOLSA)/;
const PRICE_END=/(-?\d{1,4}[.,]\d{2})\s*(?:€|EUR)?\s*[A-E]?\s*$/i;
const WEIGHT_RE=/(\d+[.,]\d{1,3})\s*(kg|g)\b\s*[x×*]?\s*(\d+[.,]\d{2})\s*(?:€|eur)?\s*\/\s*kg/i;
function parseReceipt(text, stores, today){
  const store=detectStore(text, stores), date=parseReceiptDate(text, today);
  const raw=String(text).split(/\r?\n/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean);
  const out=[]; let pendingName=null; let pendingQty=null; let receiptTotal=null; let started=false;
  for(const line of raw){
    const F=fold(line);
    if(/^TOTAL\b|TOTAL A PAGAR|TOTAL \(?€\)?|^IMPORTE TOTAL/.test(F)){ const m=line.match(PRICE_END)||line.match(/(\d{1,4}[.,]\d{2})/); if(m && receiptTotal==null) receiptTotal=parseNum(m[1]); continue; }
    if(SKIP_RE.test(F)) continue;
    const w=line.match(WEIGHT_RE);
    if(w){
      const weight=parseNum(w[1])*(w[2].toLowerCase()==="g"?0.001:1), perKg=parseNum(w[3]);
      const after=line.slice(w.index+w[0].length), before=line.slice(0,w.index).replace(/[\d.,\s]+$/,"").trim();
      const tm=after.match(PRICE_END); const total= tm? parseNum(tm[1]) : round(weight*perKg,2);
      if(before && /[A-Za-zÁÉÍÓÚÑ]{3}/.test(before)) out.push(mkLine(line, before, 1, total, weight, perKg));
      else if(pendingName){ out.push(mkLine(pendingName.raw+" / "+line, pendingName.name, 1, total, weight, perKg)); pendingName=null; }
      else if(out.length && out[out.length-1].weight==null && Math.abs(out[out.length-1].total-total)<0.011){ Object.assign(out[out.length-1],{weight, perKg}); }

    }
    const qx=line.match(/^(\d{1,2})\s*[xX×]\s*(\d{1,4}[.,]\d{2})\s*(?:€|EUR)?\s*$/i);   // "2 x 1,19" quantity lines (Lidl and others)
    if(qx){

      if(prev && Math.abs(prev.total-q*u)<0.011){ prev.qty=q; prev.unitPrice=u; prev.raw+=" / "+line; }

    }

      const unitM=rest.match(/(\d{1,4}[.,]\d{2})\s*(?:€|EUR)?\s*$/i); let unit=null;
      if(unitM){ unit=parseNum(unitM[1]); rest=rest.slice(0,unitM.index).trim(); }

        if(out.length){ const prev=out[out.length-1]; prev.total=round(prev.total+(price<0?price:-Math.abs(price)),2); prev.discount=round((prev.discount||0)+Math.abs(price),2); prev.raw+=" / "+line; }
        continue;

        if(pendingName){ out.push(mkLine(pendingName.raw+" / "+line, pendingName.name, qty, price, null, null, unit)); pendingName=null; }
        continue;
      }
      if(pendingQty && qty===1 && Math.abs(price-pendingQty.q*pendingQty.u)<0.011){ qty=pendingQty.q; unit=pendingQty.u; }
      pendingQty=null;
      out.push(mkLine(line, rest, qty, price, null, null, unit)); pendingName=null; started=true; continue;
    }

/* ---------- matching receipt names to items ---------- */
const STOP=new Set(["DE","LA","EL","EN","CON","DEL","AL","LOS","LAS","THE","OF","AND"]);
function itemTokens(s){ return tokens(s).filter(t=>!STOP.has(t)); }
function matchItem(name, items, remembered){
  const key=normLine(name);
  if(remembered && remembered[key]) return {item:remembered[key].item, score:1, how:"remembered", memo:remembered[key]};
  const rt=itemTokens(name); if(!rt.length && !/[\u3400-\u9fff]/.test(name)) return null;
  let best=null;
  const consider=(id,score)=>{ if(!best || score>best.score+1e-9) best={item:id, score, how:"guess"}; };
  for(const it of items){
    if(it.kind==="type") continue;   /* a receipt line is always a specific item, never a whole type */
    const labels=[[it.es,1],[it.en,0.9],...((it.alias||[]).map(a=>[a,1]))];
    for(const [label,w] of labels){
      const itT=itemTokens(label); if(!itT.length) continue;
      let hit=0, hits=0, pos=[];
      for(const a of itT){
        let wgt=0, at=-1;
        rt.forEach((b,i)=>{ const v = b===a ? 1 : (b.length>=3 && a.startsWith(b)) ? 0.7 : (a.length>=4 && b.startsWith(a)) ? (b.length-a.length<=2 ? 0.9 : 0.3) : 0; if(v>wgt){ wgt=v; at=i; } });   /* "AGUACATES" ≠ "AGUA": only plural endings count */
        if(wgt){ hit+=wgt; hits++; pos.push(at); }
      }
      if(!hits) continue;
      const all=hits===itT.length;
      const adjacent = pos.length>1 && pos.every((p,i)=>i===0||p===pos[i-1]+1);
      const score = w*(hit/itT.length)*(all?1:0.8) + 0.02*hits + (pos[0]===0 && itT[0]===rt[0]?0.1:0) + (adjacent?0.03:0);
      consider(it.id, score);
    }
    if(it.zh && String(name).includes(it.zh)) consider(it.id, 1.2 + 0.05*it.zh.length + (String(name).trim()===it.zh?0.5:0));   // longest Chinese match wins
  }

}
/* ---------- store comparison over items bought at several stores ---------- */
function basketIndex(purchases, minItems){
  const byItem={};
  for(const p of purchases){ if(!(p.unit_price_eur>0)||!p.store||!p.item) continue; (byItem[p.item]=byItem[p.item]||[]).push(p); }
  const ratios={};
  for(const [item,ps] of Object.entries(byItem)){
    const stores=new Set(ps.map(p=>p.store)); if(stores.size<2) continue;
    const med=priceStats(ps.map(p=>p.unit_price_eur)).median;
    const byStore={}; for(const p of ps) (byStore[p.store]=byStore[p.store]||[]).push(p.unit_price_eur);
    for(const [st,v] of Object.entries(byStore)){ (ratios[st]=ratios[st]||[]).push({item, r:priceStats(v).median/med}); }
  }
  return Object.entries(ratios).map(([store,rs])=>({store, items:rs.length, index:Math.exp(rs.reduce((a,x)=>a+Math.log(x.r),0)/rs.length), detail:rs}))
    .filter(x=>x.items>=(minItems||1)).sort((a,b)=>a.index-b.index);
}

function csvParse(text){

    if(q){ if(c=='"'){ if(text[i+1]=='"'){ field+='"'; i++; } else q=false; } else field+=c; }
    else { if(c=='"') q=true; else if(c==','){ row.push(field); field=""; } else if(c=='\n'){ row.push(field); rows.push(row); row=[]; field=""; } else if(c!='\r') field+=c; } }
  if(field!==""||row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return []; const head=rows[0];
  return rows.slice(1).filter(r=>r.length>1||(r[0]||"")!=="").map(r=>{ const o={}; head.forEach((h,i)=>o[h]=r[i]??""); return o; });
}

function isOwnLabel(brand){ const f=fold(brand); return OWN_LABELS.some(b=>fold(b)===f); }
/* Find a brand in a product name: known own labels, known brands, and common receipt abbreviations. */
function detectBrand(product){
  const t=" "+fold(product).replace(/[^A-Z0-9&' ]+/g," ").replace(/\s+/g," ")+" ";
  for(const [k,v] of Object.entries(BRAND_ALIASES)){ if(t.includes(" "+k+" ")||t.startsWith(" "+k+" ")) return {brand:v, own:isOwnLabel(v)}; }

/* ---------- types and subtypes ---------- */
function typeOf(item, items){ return item && item.type ? items.find(x=>x.id===item.type)||null : (item && item.kind==="type" ? item : null); }

/* Prices to judge against: the same subtype when it has 3+ prices, otherwise the whole type.
   opts.keep(p): only these purchases (e.g. shops in the same country). opts.since: prefer purchases from this date on (last 12 months) when there are 3+ of them. */
function historyFor(itemId, items, purchases, exceptId, opts){
  opts=opts||{};
  const ok=p=>p.id!==exceptId && p.unit_price_eur>0 && (!opts.keep || opts.keep(p));
  const recent=list=>{ if(!opts.since) return {list, recent:false}; const r=list.filter(p=>(p.date||"")>=opts.since); return r.length>=3 ? {list:r, recent:r.length<list.length} : {list, recent:false}; };
  const it=items.find(x=>x.id===itemId);
  const pick=ids=>recent(purchases.filter(p=>ids.includes(p.item)&&ok(p)));
  const own=pick([itemId]);
  if(!it) return {values:own.list.map(p=>p.unit_price_eur), scope:"item", recent:own.recent};
  if(it.kind==="type"){ const fam=pick(familyIds(it.id, items)); return {values:fam.list.map(p=>p.unit_price_eur), scope:"type", type:it, recent:fam.recent}; }
  if(it.type && own.list.length<3){
    const fam=pick(familyIds(it.type, items));
    if(fam.list.length>own.list.length) return {values:fam.list.map(p=>p.unit_price_eur), scope:"type", type:items.find(x=>x.id===it.type), own:own.list.length, recent:fam.recent};
  }

/* 1 EUR = rate × currency, on the purchase date (daily reference rates; earliest 2024-03-02) */
async function rateFor(cur, date){
  if(cur==="EUR") return 1;
  const key=`rate_${date}_${cur}`; const cached=LS.get(key,null); if(cached) return cached;
  if(date<"2024-03-02") return null;
  const tag = date>=localISO() ? "latest" : date;
  for(const url of [`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${tag}/v1/currencies/eur.min.json`, `https://${tag}.currency-api.pages.dev/v1/currencies/eur.min.json`]){
    try{ const r=await fetch(url); if(!r.ok) continue; const j=await r.json(); const v=j&&j.eur&&j.eur[cur.toLowerCase()]; if(v>0){ LS.set(key,v); return v; } }catch(e){}
  }
  return null;
}

/* f: {item, mode:"pack"|"weight", pack_count, pack_size, pack_unit, packs, price_pack, promo, pct, weight, weight_unit, per_kg, total, currency, rate} */
function computeForm(f){
  const it=itemById(f.item); if(!it) return {ok:false, why:"Choose an item"};
  if(it.nocompare){ const paid=f.price_pack; if(!(paid>0)) return {ok:false, why:"Enter what you paid"}; const rate=f.currency==="EUR"||!f.currency?1:f.rate; if(!(rate>0)) return {ok:false, why:`Exchange rate for ${f.currency} needed`};
    return {ok:true, it, qty:1, paid:round(paid,2), eur:round(paid/rate,4), up:paid/rate, rate, value: f.value>0? f.value/rate : null}; }
  let qty, paid;
  if(f.mode==="weight"){
    const wu = it.basis==="L" ? (f.weight_unit||"L") : (f.weight_unit||"kg");
    qty=toBasis(f.weight, wu, it.basis);
    paid = f.total>0 ? f.total : (f.per_kg>0 && f.weight>0 ? round(toBasis(f.weight,wu,it.basis==="unit"?"kg":it.basis)*f.per_kg,2) : NaN);
  } else {
    qty=quantityInBasis({pack_count:f.pack_count, pack_size:f.pack_size, pack_unit:f.pack_unit, packs:f.packs}, it.basis);
    paid = f.price_pack>0 ? round(f.price_pack*(f.packs>0?f.packs:1)*promoFactor(f.promo,f.pct),2) : NaN;
  }
  if(!(qty>0)) return {ok:false, why: it.basis==="unit" ? `Enter how many ${unitWord(it)}s` : `Enter the size in ${it.basis==="kg"?"g or kg":"ml, cl or L"}`};
  if(!(paid>0)) return {ok:false, why:"Enter the price"};
  const rate = f.currency==="EUR"||!f.currency ? 1 : f.rate;
  if(!(rate>0)) return {ok:false, why:`Exchange rate for ${f.currency} needed`};
  const eur=round(paid/rate,4); return {ok:true, it, qty, paid, eur, up:eur/qty, rate};
}

async function savePurchaseForm(){

    if(ol && !confirm(`${fmtUnitPrice(c.up,c.it.basis,unitWord(c.it))} is ${ol.high?Math.round(ol.ratio)+"× ":"far below "}your usual ${fmtUnitPrice(ol.median,c.it.basis,unitWord(c.it))} for ${disp(c.it)}. Check the price and the size unit. Save anyway?`)) return; }
  if(F._kind!=="edit"){ const dup=findDuplicatePurchase(S.purchases,row); if(dup && !confirm(`${disp(c.it)} at ${storeName(row.store)} on ${niceDate(row.date)} for ${fmtMoney(row.price_paid,row.currency)} is already logged${dup.person?` by ${S.people[dup.person]||dup.person}`:""}. Save it again?`)) return; }
  const btn=document.querySelector('[data-act="savepurchase"]'); if(btn){ btn.disabled=true; btn.textContent="Saving…"; }

  row.photo=photo||"";

    try{ await rewritePurchases(rows=>rows.map(r=>r.id===row.id?row:r), `Edit ${c.it.en} ${row.date}`); toast("Changes saved"); F=null; location.hash="item/"+encodeURIComponent(row.item); }
    catch(e){ toast(e.message); if(btn){ btn.disabled=false; btn.textContent="Save changes"; } }
    return;
  }
  const res=await savePurchases([row], `${S.people[cfg.person]||cfg.person}: ${c.it.en} at ${storeName(row.store)}`);
  toast(res.text); const id=row.item; F=null; location.hash="item/"+encodeURIComponent(id);

   :`<p class="empty">Buy the same items at two or more shops and the comparison appears here.</p>`}`;

function cheapestPerItem(){
  const out=[]; const by={};
  for(const p of S.purchases){ if(!comparable(p) || storeCountry(p.store)!==HOME) continue; ((by[p.item]=by[p.item]||{})[p.store]=(by[p.item][p.store]||[])).push(p.unit_price_eur); }
  for(const [item,st] of Object.entries(by)){ const it=itemById(item); if(!it || Object.keys(st).length<2) continue;
    const meds=Object.entries(st).map(([s,v])=>[s,priceStats(v).median]).sort((a,b)=>a[1]-b[1]); out.push({it, store:meds[0][0], med:meds[0][1], saving:1-meds[0][1]/meds[meds.length-1][1]}); }
  return out.sort((a,b)=>b.saving-a.saving);
}
let PF={q:"", period:"all", from:"", to:"", cat:"", shop:""};
function periodRange(p){ const t=new Date(), y=t.getFullYear(), m=t.getMonth(); const iso=d=>localISO(d);
  if(p==="month") return [iso(new Date(y,m,1)), iso(t)]; if(p==="3m") return [iso(new Date(y,m-2,1)), iso(t)];
  if(p==="year") return [`${y}-01-01`, iso(t)]; if(p==="lastyear") return [`${y-1}-01-01`, `${y-1}-12-31`];
  if(p==="custom") return [PF.from||"0000", PF.to||"9999"]; return ["0000","9999"]; }
function purchaseMatches(p){
  const [a,b]=periodRange(PF.period); if((p.date||"")<a || (p.date||"")>b) return false;
  const it=itemById(p.item); const ty=it&&it.type?itemById(it.type):null;
  if(PF.cat && (it?it.cat:"")!==PF.cat) return false;
  if(PF.shop && p.store!==PF.shop) return false;
  if(PF.q){ const q=fold(PF.q); const hay=[it&&disp(it), it&&it.es, it&&it.zh, ty&&ty.es, ty&&ty.zh, p.product, brandOf(p), storeName(p.store), p.notes].filter(Boolean).map(fold).join(" | "); if(!hay.includes(q)) return false; }
  return true;
}
function purchasesListHTML(){
  const ps=S.purchases.filter(purchaseMatches).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.id||"").localeCompare(a.id||""));
  const clear = PF.q||PF.period!=="all"||PF.cat||PF.shop ? ` · <button class="linkbtn" data-act="pfclear">Clear filters</button>` : "";

  return `<p class="sub"><b>${ps.length}</b> purchase${ps.length===1?"":"s"} · <b>${esc(fmtMoney(total,"EUR"))}</b>${clear}</p>`+Object.entries(byMonth).map(([m,v])=>`<div class="card"><h2 class="sec">${esc(new Date(m+"-15T12:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"}))} · ${esc(fmtMoney(v.reduce((a,p)=>a+(p.price_eur||0),0),"EUR"))}</h2><div class="list">${v.map(p=>purchaseLi(p).replace(`data-go="item/${encodeURIComponent(p.item)}"`,`data-go="edit/${encodeURIComponent(p.id)}"`)).join("")}</div></div>`).join("");
}

async function importFile(){
  const file=$("#imp_file")&&$("#imp_file").files[0]; if(!file){ toast("Choose a CSV file first."); return; }
  const rows=csvParse(await file.text()); const need=["id","date","store","item","price_paid"];
  if(!rows.length || need.some(k=>!(k in rows[0]))){ toast("This file isn't in the app's format (it needs id, date, store, item and price_paid columns)."); return; }
  const have=new Set(S.purchases.map(p=>p.id)); const fresh=rows.filter(r=>r.id && !have.has(r.id));
  const noItem=[...new Set(fresh.filter(r=>!itemById(r.item)).map(r=>r.item))], noShop=[...new Set(fresh.filter(r=>!storeById(r.store)).map(r=>r.store))];
  if(noItem.length||noShop.length){ toast(`Upload the latest items.json and stores.json first: ${[...noItem,...noShop].slice(0,4).join(", ")}${noItem.length+noShop.length>4?"…":""} not found.`); return; }
  if(!fresh.length){ toast(`All ${rows.length} rows are already in your data.`); return; }
  if(!confirm(`Add ${fresh.length} purchase${fresh.length===1?"":"s"}${rows.length>fresh.length?` (${rows.length-fresh.length} already there are skipped)`:""}?`)) return;
  const cols=LOG_HEADER.split(","); const lines=fresh.map(r=>csvLine(cols.map(c=>r[c]??"")));
  try{ const text=await ghUpdate("purchases.csv", t=>appendLines(t,lines), `Import ${fresh.length} purchases from ${file.name}`); S.purchases=csvParse(text).map(numRow); saveCache(); toast(`${fresh.length} purchases imported`); location.hash="home"; }
  catch(e){ toast(e.message); }
}

  if(a==="checktolog"){ if(!F.item){ toast("Choose an item first."); return; } F._kind="log"; F._carry=true; location.hash="log/"+encodeURIComponent(F.item); return; }
  if(a==="savepurchase") return savePurchaseForm();
  if(a==="delpurchase"){ if(!confirm("Delete this purchase? It can only be undone from GitHub's history.")) return; const id=F.id, item=F.item; try{ await rewritePurchases(rows=>rows.filter(r=>r.id!==id), `Delete purchase ${id}`); toast("Purchase deleted"); F=null; location.hash="item/"+encodeURIComponent(item); }catch(e){ toast(e.message); } return; }
  if(a==="checkitem"){ F=blankForm(t.dataset.id); F._kind="check"; F._carry=true; const it=itemById(t.dataset.id); F.pack_unit=defaultUnit(it); F.mode= it.basis!=="unit" && ["fruit","veg","meat","fish"].includes(it.cat)?"weight":"pack"; location.hash="check/"+encodeURIComponent(t.dataset.id); return; }
  if(a==="logitem"){ F=blankForm(t.dataset.id); F._kind="log"; F._carry=true; const it=itemById(t.dataset.id); F.pack_unit=defaultUnit(it); F.mode= it.basis!=="unit" && ["fruit","veg","meat","fish"].includes(it.cat)?"weight":"pack"; location.hash="log/"+encodeURIComponent(t.dataset.id); return; }
  if(a==="readreceipt") return readReceipt();
  if(a==="resetreceipt"){ RC=null; renderReceipt(); return; }
  if(a==="savereceipt") return saveReceipt();
  if(a==="pickline"){ const i=+t.dataset.i; return openPicker(id=>{ const l=RC.lines[i]; l.item=id; l.how="chosen"; const it=itemById(id); if(it.basis==="unit"){ l.count = l.size && !l.unit ? l.count : (l.count||""); } renderReceipt(); }, RC.lines[i].name.split(" ")[0]); }
  if(a==="savecfg") return connect();
  if(a==="importfile") return importFile();
  if(a==="saveshop") return saveShop(t.dataset.id);
  if(a==="newshopfromlist"){ return openStorePicker(id=>{ location.hash="shopedit/"+encodeURIComponent(id); }); }
  if(a==="syncnow"){ toast("Syncing…"); await sync(); toast(S.error||"Synced"); render(); return; }
  if(a==="forget"){ if(confirm("Remove the token from this phone? Your data on GitHub stays safe.")){ cfg.token=""; saveCfg(); render(); } return; }
  if(a==="savenames"){ const next={user1:$("#n1").value.trim()||DEFAULT_PEOPLE.user1, user2:$("#n2").value.trim()||DEFAULT_PEOPLE.user2}; try{ await saveJson("people.json",next,"Rename people"); S.people=next; saveCache(); toast("Names saved"); renderSettings(false); }catch(e){ toast(e.message); } return; }
});
document.addEventListener("input", ev=>{
  const el=ev.target;
  if(el.id==="h_q"){ const r=searchItems(el.value); $("#h_res").innerHTML=r.map(itemLi).join("")||(el.value?`<p class="empty">No match. <button class="btn small" data-act="newitemstandalone">+ New item</button></p>`:""); return; }
  if(el.id==="pk_q") return pickerList();
  if(el.id==="sp_q") return storeList();
  if(el.id==="pf_q"){ PF.q=el.value; $("#pf_list").innerHTML=purchasesListHTML(); return; }
  if(el.id==="if_q"){ IF.q=el.value; $("#if_list").innerHTML=itemsListHTML((location.hash.split("/")[1]||"")); return; }
  if(el.id==="f_brand" && F){ F.brand=el.value; const own=$("#f_own"); if(own && F.own==="") own.checked=isOwnLabel(el.value); return; }
  if(el.dataset.f && F){ F[el.dataset.f]=el.value; if(el.tagName!=="SELECT") updateResult(); return; }
  if(el.dataset.l!==undefined && RC){ if(el.type==="checkbox") return; RC.lines[+el.dataset.i][el.dataset.l]=el.value; updateReceiptLine(+el.dataset.i); return; }
  if(el.dataset.r && RC){ RC[el.dataset.r]=el.value; }
});
document.addEventListener("change", async ev=>{
  const el=ev.target;
  if(el.id==="f_own" && F){ F.own=el.checked?"1":"0"; return; }
  if(el.id==="f_product" && F){ F.product=el.value; if(!F.brand){ const d=detectBrand(el.value); if(d){ F.brand=d.brand; const b=$("#f_brand"); if(b) b.value=d.brand; const own=$("#f_own"); if(own&&F.own==="") own.checked=d.own; } } return; }
  if(el.id==="it_cat"){ location.hash="items/"+el.value; return; }
  if(el.id==="if_bought"){ IF.bought=el.checked; $("#if_list").innerHTML=itemsListHTML((location.hash.split("/")[1]||"")); return; }
  if(el.id==="pf_cat"){ PF.cat=el.value; $("#pf_list").innerHTML=purchasesListHTML(); return; }
  if(el.id==="pf_shop"){ PF.shop=el.value; $("#pf_list").innerHTML=purchasesListHTML(); return; }
  if(el.id==="pf_from"||el.id==="pf_to"){ PF[el.id==="pf_from"?"from":"to"]=el.value; $("#pf_list").innerHTML=purchasesListHTML(); return; }
  if(el.dataset.f && F){
    if(el.dataset.f==="store" && el.value==="__new"){ const n=prompt("Name of the shop"); if(n&&n.trim()){ try{ const st=await addStore(n.trim()); F.store=st.id; }catch(e){ toast(e.message); F.store=""; } } else F.store=""; renderForm(F._kind,F.item); return; }
    F[el.dataset.f]=el.value;
    if(el.dataset.f==="currency"){ F.rate= el.value==="EUR"?1:""; renderForm(F._kind,F.item); if(el.value!=="EUR") lookupRate(); return; }
    if(el.dataset.f==="date" && F.currency!=="EUR"){ F.rate=""; lookupRate(); }
    if(["promo","pack_unit","weight_unit"].includes(el.dataset.f)){ renderForm(F._kind,F.item); return; }
    updateResult(); return;
  }
  if(el.dataset.l!==undefined && RC){ const l=RC.lines[+el.dataset.i]; if(el.type==="checkbox"){ l.on=el.checked; renderReceipt(); } else { l[el.dataset.l]=el.value; updateReceiptLine(+el.dataset.i); } return; }
  if(el.dataset.r && RC){
    if(el.dataset.r==="store" && el.value==="__new"){ const n=prompt("Name of the shop"); if(n&&n.trim()){ try{ const st=await addStore(n.trim()); RC.store=st.id; }catch(e){ toast(e.message); } } renderReceipt(); return; }
    RC[el.dataset.r]=el.value;
    if(el.dataset.r==="store"){ const mem=(S.mappings.byStore||{})[RC.store]||{}; for(const l of RC.lines){ if(!l.item||l.how==="guess"){ const m=matchItem(l.name,S.items,mem); if(m&&m.how==="remembered"){ l.item=m.item; l.how="remembered"; } } } }
    if(el.dataset.r==="currency"){ RC.rate= el.value==="EUR"?1:""; if(el.value!=="EUR"){ const r=await rateFor(el.value,RC.date||localISO()); if(r) RC.rate=round(r,6); else toast(`Couldn't look up the ${el.value} rate. Type it in.`); } }
    renderReceipt(); return;
  }
});

/* ===================== START ===================== */
loadCache(); render(); if(cfg.token) sync().then(render);

</script>
